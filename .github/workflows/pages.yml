name: Analysis and report

# Reruns the full analysis and republishes the website whenever code is pushed (or on demand).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # commit the README results table
  pages: write # publish the website
  id-token: write

concurrency:
  group: report
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test before running on real data
        run: pytest -q

      - name: Run analysis (experiment, uplift models, targeting, website)
        run: python -m emailexp.pipeline
        env:
          PYTHONPATH: src

      - name: Save README results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "Update results"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
